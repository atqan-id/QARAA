[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qaraa-client"
version = "0.1.0"
description = "Typed protocol-v1 client for a remote QARAA server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pydantic>=2.13.4,<3", "httpx>=0.28.1,<1", "websockets>=16.1.1,<17"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "build>=1.4,<2", "twine>=6.2,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/qaraa"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
