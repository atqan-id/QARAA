[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qaraa-fastapi-example"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["fastapi>=0.139.2,<1", "qaraa-client>=0.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "httpx>=0.28.1,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
